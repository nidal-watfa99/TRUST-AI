name: Deploy TRUST AI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

# The site is built from the extracted contents of TRUST-AI-v3.1.zip (kept in the repo root).
# To release a new version: upload a new TRUST-AI-v3.1.zip (same name) and the workflow does the rest.

jobs:
  verify:
    name: Tests & security audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract the zip
        run: |
          mkdir _app
          unzip -q TRUST-AI-v3.1.zip -d _app
          APP="$(dirname "$(find _app -name package.json -not -path '*/node_modules/*' | head -n 1)")"
          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "App folder: $APP"
      - name: Run checks
        run: npm run check
        working-directory: ${{ env.APP }}

  deploy:
    name: Publish to GitHub Pages
    needs: verify
    runs-on: ubuntu-latest
    permissions:

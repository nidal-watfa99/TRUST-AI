name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  checks:
    name: Tests & static audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract zip if present
        run: |
          if [ -f TRUST-AI-v3.1.zip ]; then
            unzip -q TRUST-AI-v3.1.zip -d _app
            INNER=$(find _app -mindepth 1 -maxdepth 1 -type d | head -1)
            echo "Extracted folder: $INNER"
            cp -r "$INNER"/. .
          fi
      - run: npm run check

  codeql:
    name: CodeQL (JavaScript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3

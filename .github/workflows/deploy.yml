name: Deploy TRUST AI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip TRUST-AI v3.0
        run: |
          ZIP="TRUST-AI-v3.0.zip"
          test -f "$ZIP" || { echo "❌ الملف $ZIP غير موجود"; exit 1; }

          rm -rf /tmp/extracted _site
          mkdir -p /tmp/extracted _site
          unzip -q -o "$ZIP" -x "__MACOSX/*" -d /tmp/extracted

          # إذا كان المحتوى داخل مجلد واحد، نستخدم محتواه مباشرة
          COUNT=$(ls -A /tmp/extracted | wc -l)
          if [ "$COUNT" -eq 1 ] && [ -d "/tmp/extracted/$(ls -A /tmp/extracted)" ]; then
            cp -a /tmp/extracted/*/. _site/
          else
            cp -a /tmp/extracted/. _site/
          fi

          touch _site/.nojekyll
          test -f _site/index.html || { echo "❌ index.html غير موجود بعد فك الضغط"; exit 1; }

          echo "✅ تم فك الضغط، المحتويات:"
          ls -la _site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

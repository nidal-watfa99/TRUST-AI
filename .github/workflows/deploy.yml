name: Deploy TRUST AI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    name: Tests & security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract zip if present
        run: |
          if [ -f TRUST-AI-v3.1.zip ]; then
            unzip -q TRUST-AI-v3.1.zip -d _app
            cp -r _app/TRUST-AI-v3.1/. .
          fi
      - run: npm run check

  deploy:
    name: Publish to GitHub Pages
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Extract zip if present
        run: |
          if [ -f TRUST-AI-v3.1.zip ]; then
            unzip -q TRUST-AI-v3.1.zip -d _app
            cp -r _app/TRUST-AI-v3.1/. .
          fi
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html sw.js manifest.json css js assets .nojekyll .well-known _site/
          [ -f _headers ] && cp _headers _site/ || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

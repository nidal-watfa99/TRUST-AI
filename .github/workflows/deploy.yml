name: Deploy TRUST AI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    name: Tests & security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Prepare app (use newest zip if present)
        run: bash .github/scripts/prepare-app.sh
      - name: Run tests & audit (report errors clearly)
        continue-on-error: true
        run: |
          cd "$APP_DIR"
          set +e
          npm run check > "$GITHUB_WORKSPACE/check.log" 2>&1
          code=$?
          tail -n 60 "$GITHUB_WORKSPACE/check.log"
          if [ "$code" -ne 0 ]; then
            {
              echo "## Tests/audit FAILED (exit $code)"
              echo '```'
              grep -nE "✗|Error:|Cannot find|ERR_|FAIL" "$GITHUB_WORKSPACE/check.log" | head -30
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -E "✗|Error:|Cannot find|ERR_|FAIL" "$GITHUB_WORKSPACE/check.log" | head -10 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit "$code"

  deploy:
    name: Publish to GitHub Pages
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare app (use newest zip if present)
        run: bash .github/scripts/prepare-app.sh
      - name: Assemble site
        run: |
          rm -rf _site
          mkdir -p _site
          cd "$APP_DIR"
          cp -r index.html sw.js manifest.json css js assets .nojekyll .well-known "$GITHUB_WORKSPACE/_site/"
          [ -f _headers ] && cp _headers "$GITHUB_WORKSPACE/_site/" || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

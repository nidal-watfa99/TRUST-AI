<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Outer shield -->
  <path d="M32 4 L54 12 L54 32 C54 46 44 56 32 60 C20 56 10 46 10 32 L10 12 Z" fill="url(#g)" filter="url(#glow)" opacity="0.95"/>
  <!-- Inner shine -->
  <path d="M32 8 L50 14.5 L50 31 C50 43 42 51.5 32 55 C22 51.5 14 43 14 31 L14 14.5 Z" fill="url(#shine)"/>
  <!-- Check / trust mark -->
  <path d="M22 32 L29 39 L44 22" stroke="#0a0f1a" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M22 32 L29 39 L44 22" stroke="#ecfeff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>

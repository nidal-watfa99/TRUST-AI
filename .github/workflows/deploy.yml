name: Deploy TRUST AI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip the archive
        run: |
          unzip -o TRUST-AI-v1_6.zip -d /tmp/extracted
          # نسخ محتويات المجلد المستخرج إلى جذر المستودع
          if [ -d /tmp/extracted/TRUST-AI ]; then
            cp -r /tmp/extracted/TRUST-AI/* .
          else
            # في حال كان المحتوى مباشرة داخل الملف المضغوط
            cp -r /tmp/extracted/* .
          fi
          rm -rf /tmp/extracted

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

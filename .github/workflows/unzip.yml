name: Unzip

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  unzip:
    name: Unzip into repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract newest zip into the repository root
        run: |
          set -euo pipefail
          ZIP=$(ls -1 TRUST-AI*.zip 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$ZIP" ]; then
            echo "::error::No TRUST-AI*.zip found in the repository root"
            exit 1
          fi
          echo "Using $ZIP"
          rm -rf "$RUNNER_TEMP/x"
          mkdir -p "$RUNNER_TEMP/x"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/x"
          SRC="$RUNNER_TEMP/x"
          if [ ! -f "$SRC/package.json" ]; then
            SRC=$(dirname "$(find "$SRC" -maxdepth 3 -name package.json | head -1)")
          fi
          shopt -s dotglob
          for item in "$SRC"/*; do
            name=$(basename "$item")
            case "$name" in .git|.github) continue ;; esac
            rm -rf "./$name"
            cp -r "$item" "./$name"
          done
          rm -f "$ZIP"
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unzip TRUST AI v3.1 into repository" || echo "Nothing to commit"
          git push
      - name: Start deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref "${{ github.ref_name }}"
